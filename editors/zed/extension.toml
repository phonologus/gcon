id = "gcon"
name = "Icon (gcon)"
version = "0.3.0"
schema_version = 1
authors = ["Sean Jensen"]
description = "Icon as gcon reads it: highlighting (with gcon's \\u escapes, cset ranges and built-ins), outline, and gcon's language server (diagnostics and vet warnings, hover, go to definition, references, completion, signature help, rename, formatting)."
repository = "https://github.com/phonologus/gcon"

# The grammar is in this repository, editors/tree-sitter-gcon, pinned at
# the commit that last changed it (editors/test.sh checks that the pinned
# grammar is the current one).
[grammars.gcon]
repository = "https://github.com/phonologus/gcon"
rev = "51810d17f33c76f5ce0b3daf5bde112f0d6fcd4e"
path = "editors/tree-sitter-gcon"

[language_servers.gcon]
name = "gcon"
languages = ["Icon"]
